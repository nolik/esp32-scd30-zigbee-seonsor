[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "firmware"
harness = false # no test harness on target

[features]
default = ["self-heal"]
# Q30: re-assert FRC from the Stored Reference at boot (needed for this defective SCD30 unit).
self-heal = []

[dependencies]
anyhow = "1"
esp-idf-svc = "0.51"
log = "0.4"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
debug = true # symbols stay in the ELF only; not flashed

[profile.dev]
debug = true
opt-level = "z"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

# Q11 / ADR 0001: Espressif ZBOSS SDK v1, pinned exactly (v2 changes storage format and API).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-zigbee-lib", version = "==1.6.8" }
bindings_header = "src/zb/bindings.h"
bindings_module = "zb"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-zboss-lib", version = "==1.6.4" }
